# Site settings
title: "Harshad Mangesh Malik - Robotics & Mechatronics Portfolio"
description: "An extensive deep dive into my Mechanical, Robotic and Mechatronic projects"
url: "https://harshadmm.github.io"
baseurl: "/MESGRO_HM"
author: "Harshad Malik"
email: "harshadmm10131@gmail.com"
phone_number: "+447424448110"
phone_display: "+44 7424 448110"
github_username: "HarshadmM"
linkedin_username: "Harshad Malik"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/
  publications:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "Publications, Awards & Milestones"
    url: "/publications/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Hybrid continuum-eversion robotics"
  - name: "Mechatronics"
    slug: "mechatronics"
    description: "Integration of mechanical, electrical, and software systems"
  - name: "Microrobotics"
    slug: "microrobotics"
    description: "Control and interaction with microscale robotic systems"
  - name: "Control"
    slug: "control"
    description: "Control systems linking sensors, software, simulation, and actuation"
  - name: "Microactuation"
    slug: "microactuation"
    description: "Small-scale mechanisms and actuators for robotic interaction"
  - name: "Haptics"
    slug: "haptics"
    description: "Wearable tactile interfaces for robotic interaction and teleoperation"
  - name: "CAD & Design"
    slug: "cad-design"
    description: "CAD-led concepts and mechanical device design"
  - name: "Arduino"
    slug: "arduino"
    description: "Arduino-based sensing and control in robotics projects"
  - name: "3D Printing"
    slug: "3d-printing"
    description: "Custom 3D printed components and designs"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#f0f0f0"
  camera_controls: true
  auto_rotate: false

# Schema settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
