# Site settings
title: "Harshad Mangesh Malik - Robotics & Mechatronics Portfolio"
description: "An extensive deep dive into my Mechanical, Robotic and Mechatronic projects"
url: "https://harshadmm.github.io"
baseurl: "/MESGRO_HM"
author: "Harshad Malik"
email: "harshadmm10131@gmail.com"
github_username: "HarshadmM"
linkedin_username: "Harshad Malik"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Hybrid continuum-eversion robotics"
  - name: "Mechatronics"
    slug: "mechatronics"
    description: "Integration of mechanical, electrical, and software systems"
  - name: "Arduino"
    slug: "arduino"
    description: "Arduino-based projects and prototypes"
  - name: "3D Printing"
    slug: "3d-printing"
    description: "Custom 3D printed components and designs"
  - name: "IoT"
    slug: "iot"
    description: "Internet of Things devices and applications"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#f0f0f0"
  camera_controls: true
  auto_rotate: false

# Schema settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
