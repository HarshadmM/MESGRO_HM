{% assign gallery_group = include.gallery_group %}
<div class="gallery-group gallery-group--{{ gallery_group.layout | default: 'stack' }}"{% if gallery_group.placement %} data-mobile-gallery-placement="{{ gallery_group.placement | slugify }}"{% endif %}>
    {% if gallery_group.title %}
    <h5 class="gallery-group-title">{{ gallery_group.title | escape }}</h5>
    {% endif %}
    <div class="gallery-group-items">
        {% for media in gallery_group.items %}
        {% if media.file != include.project_lead_image %}
        <figure class="gallery-group-item{% if media.position %} gallery-item--{{ media.position }}{% endif %}">
            {% assign file_extension = media.file | split: '.' | last | downcase %}
            {% if file_extension == 'mp4' or file_extension == 'webm' or file_extension == 'ogg' %}
            <video class="gallery-video" controls muted loop playsinline preload="none" data-loop-on-view>
                <source src="{{ media.file | relative_url }}" type="video/{{ file_extension }}">
                Your browser does not support the video tag.
            </video>
            {% else %}
            <img src="{{ media.file | relative_url }}"
                alt="{{ media.description | default: page.title | escape }}"
                class="gallery-image" data-zoomable data-rotation="{{ media.rotation | default: 0 }}" loading="lazy">
            {% endif %}
            {% assign media_caption = media.description | strip %}
            {% if media_caption != "" %}
            <figcaption>{{ media_caption | escape }}</figcaption>
            {% endif %}
        </figure>
        {% endif %}
        {% endfor %}
    </div>
</div>
