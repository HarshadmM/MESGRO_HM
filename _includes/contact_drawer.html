<aside class="contact-dock" aria-label="Contact links">
    <a class="contact-action contact-action--linkedin"
       href="https://www.linkedin.com/in/harshadmm"
       target="_blank" rel="noopener noreferrer"
       aria-label="Open Harshad's LinkedIn profile">
        <span class="contact-action-icon" aria-hidden="true"><i class="fab fa-linkedin-in"></i></span>
        <span class="contact-action-label">LinkedIn</span>
    </a>

    {% if site.phone_number %}
    <a class="contact-action contact-action--phone"
       href="tel:{{ site.phone_number | escape }}"
       aria-label="Call Harshad at {{ site.phone_display | default: site.phone_number | escape }}">
        <span class="contact-action-icon" aria-hidden="true"><i class="fas fa-phone"></i></span>
        <span class="contact-action-label">{{ site.phone_display | default: site.phone_number | escape }}</span>
    </a>
    {% endif %}

    {% if site.email %}
    <a class="contact-action contact-action--email"
       href="mailto:{{ site.email | escape }}"
       aria-label="Email Harshad at {{ site.email | escape }}">
        <span class="contact-action-icon" aria-hidden="true"><i class="fas fa-envelope"></i></span>
        <span class="contact-action-label">{{ site.email | escape }}</span>
    </a>
    {% endif %}
</aside>
